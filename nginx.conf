server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Videos y música: permitir adelantar (peticiones por partes)
    location ~* \.(mp4|mp3)$ {
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    # React Router: cualquier ruta (/productos, /admin...) carga index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
